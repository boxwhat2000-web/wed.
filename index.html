<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title> มีไรจะบอก </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", "Kanit", sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #fff0f6);
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 320px;
      width: 90%;
      position: relative;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 30px;
      color: #ff4d88;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      border: none;
      padding: 12px 22px;
      font-size: 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #yesBtn {
      background: #ff4d88;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 77, 136, 0.4);
    }

    #noBtn {
      background: #e0e0e0;
      color: #555;
    }

    button:hover {
      transform: scale(1.05);
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 2s ease-out forwards;
      pointer-events: none;
    }

    @keyframes float {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.5);
      }
    }

    .result {
      margin-top: 25px;
      font-size: 18px;
      color: #ff4d88;
      display: none;
    }
    @keyframes shake {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(-10px); }
      40%  { transform: translateX(10px); }
      60%  { transform: translateX(-10px); }
      80%  { transform: translateX(10px); }
      100% { transform: translateX(0); }
}

.shake {
  animation: shake 0.4s;
}

  </style>
</head>
<body>
  <div class="card">
    <h1>การ์ตูนเป็นแฟนกันไหม 💕</h1>

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 🙈</button>
    </div>

    <div class="result" id="result">เย้!ๆๆๆดีใจที่สุดเลย 🥰💞</div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
 //เม้าหนี  
noBtn.addEventListener("mouseover", () => {
  const maxX = window.innerWidth - noBtn.offsetWidth;
  const maxY = window.innerHeight - noBtn.offsetHeight;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  noBtn.style.position = "fixed";
  noBtn.style.left = randomX + "px";
  noBtn.style.top = randomY + "px";

  // กันแตะ (มือถือ)
  noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
  });
});


    yesBtn.addEventListener("click", () => {
  // เมื่อกด Yes ให้เปลี่ยนหน้าเว็บไปยังหน้า love.html
  window.location.href = "love.html";
});

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "💖";

      const card = document.querySelector(".card");
      const rect = card.getBoundingClientRect();

      heart.style.left = rect.width / 2 + "px";
      heart.style.top = rect.height / 2 + "px";

      card.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 2000);
    }
  </script>
</body>
</html>
