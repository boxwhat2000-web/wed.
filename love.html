<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เรารักเธอ 💖</title>

<style>
body {
  height: 100vh;
  margin: 0;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: linear-gradient(135deg, #ffb6c1, #ffe4ec);
  font-family: "Kanit", sans-serif;
  text-align: center;
}

h1 {
  color: #ff2d75;
  font-size: 32px;
  z-index: 2;
}

/* ปุ่ม Play */
.play-btn {
  margin-top: 20px;
  padding: 14px 26px;
  border-radius: 999px;
  border: none;
  background: #ff2d75;
  color: white;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  z-index: 2;
}

/* แถบควบคุมเสียง */
.audio-ui {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.8);
  padding: 10px 16px;
  border-radius: 999px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  z-index: 2;
}

.audio-ui button {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: #ff4d88;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

.muted {
  background: #aaa !important;
}

.volume-text {
  font-size: 14px;
  color: #ff2d75;
  min-width: 45px;
}

/* 💖 หัวใจลอย */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 24px;
  animation: floatUp 5s linear forwards;
  opacity: 0.8;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  100% {
    transform: translateY(-110vh) scale(1.6);
    opacity: 0;
  }
}
</style>
</head>

<body>

<h1>เป็นแฟนกันแล้วไม่ให้ไปไหนแล้วนะ 💕🥰</h1>

<button class="play-btn" id="playBtn">▶ เล่นเพลง</button>

<audio id="loveSong" src="Musketeers .mp3" loop></audio>

<div class="audio-ui">
  <button id="volDown">➖</button>
  <button id="muteBtn">🔊</button>
  <button id="volUp">➕</button>
  <span class="volume-text" id="volumeText">20%</span>
</div>

<script>
const song = document.getElementById("loveSong");
const playBtn = document.getElementById("playBtn");
const volDown = document.getElementById("volDown");
const volUp = document.getElementById("volUp");
const muteBtn = document.getElementById("muteBtn");
const volumeText = document.getElementById("volumeText");

// เริ่มต้นเสียง 40%
song.volume = 0.2;
let isPlaying = false;

function updateVolumeUI() {
  volumeText.textContent = Math.round(song.volume * 100) + "%";
  if (song.muted || song.volume === 0) {
    muteBtn.textContent = "🔇";
    muteBtn.classList.add("muted");
  } else {
    muteBtn.textContent = "🔊";
    muteBtn.classList.remove("muted");
  }
}

// Play / Pause
playBtn.addEventListener("click", () => {
  if (!isPlaying) {
    song.play();
    playBtn.textContent = "⏸ หยุดเพลง";
    isPlaying = true;
  } else {
    song.pause();
    playBtn.textContent = "▶ เล่นเพลง";
    isPlaying = false;
  }
});

// ลดเสียง
volDown.addEventListener("click", () => {
  song.muted = false;
  song.volume = Math.max(0, song.volume - 0.1);
  updateVolumeUI();
});

// เพิ่มเสียง
volUp.addEventListener("click", () => {
  song.muted = false;
  song.volume = Math.min(1, song.volume + 0.1);
  updateVolumeUI();
});

// ปิดเสียง
muteBtn.addEventListener("click", () => {
  song.muted = !song.muted;
  updateVolumeUI();
});

// 💖 สร้างหัวใจลอย
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = 18 + Math.random() * 20 + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 5000);
}, 400);

updateVolumeUI();
</script>

</body>
</html>
